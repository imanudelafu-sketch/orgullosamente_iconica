<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Registro Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Registrar Venta (Sistema Pro)</h2>
    <form id="ventaForm">
        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="email" id="email" placeholder="Email" required>
        <select id="selectFavorita" required><option>Cargando...</option></select>
        <button type="submit" id="btnGuardar">Guardar Venta</button>
    </form>

    <script>
        const cliente = supabase.createClient('https://ctptnedwysxmlpzxujel.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0cHRuZWR3eXN4bWxwenh1amVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3Njc5ODgsImV4cCI6MjA5MzM0Mzk4OH0.M_Jz_QfTJuKsGbNqnayvCGXkX_6tVxF42-LA8w0FH_g');

        // Cargar participantes
        async function cargarParticipantes() {
            const { data } = await cliente.from('contendientes').select('id, nombre');
            const select = document.getElementById('selectFavorita');
            select.innerHTML = data.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
        }
        cargarParticipantes();

        // Guardar con lógica de validación única
        document.getElementById('ventaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;
            btn.textContent = 'Procesando...';

            const favoritaId = parseInt(document.getElementById('selectFavorita').value);
            let esUnico = false;
            let final, sorted;

            while (!esUnico) {
                let randoms = [];
                while(randoms.length < 4) {
                    let n = Math.floor(Math.random() * 20) + 1;
                    if(!randoms.includes(n) && n !== favoritaId) randoms.push(n);
                }
                final = [favoritaId, ...randoms];
                sorted = [...final].sort((a, b) => a - b);

                const { data } = await cliente.from('tickets').select('combination_sorted').eq('combination_sorted', sorted);
                if (!data || data.length === 0) esUnico = true;
            }

            const { error } = await cliente.from('tickets').insert([{
                buyer_name: document.getElementById('nombre').value,
                buyer_email: document.getElementById('email').value,
                favorite_drag_id: favoritaId,
                combination: final,
                combination_sorted: sorted
            }]);

            if(error) { alert("Error: " + error.message); }
            else { alert("¡Venta registrada con éxito!"); }
            
            btn.disabled = false; btn.textContent = 'Guardar Venta';
        });
    </script>
</body>
</html>
