<form id="adminForm">
    <input type="text" id="nombre" placeholder="Nombre" required>
    <input type="email" id="email" placeholder="Email" required>
    <select id="favoritaId">
        <option value="1">Draga 1</option>
        </select>
    <button type="submit">Registrar Venta</button>
</form>

<script>
document.getElementById('adminForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const response = await fetch('URL_DE_TU_FUNCTION_AQUI', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            favoriteDrag: parseInt(document.getElementById('favoritaId').value)
        })
    });
    
    if (response.ok) alert('¡Venta registrada en la base de datos!');
});
</script>
