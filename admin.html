<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Icónica Drag Virtual</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 40px; display: flex; justify-content: center; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 15px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #ff00ff; margin-bottom: 25px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #ff00ff; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #d400d4; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registrar Venta (Sistema Pro)</h2>
    <input type="text" id="nombreCliente" placeholder="Nombre del Cliente">
    <input type="email" id="emailCliente" placeholder="Email del Cliente">
    
    <select id="dragaSelect">
        <option value="">Selecciona una Draga...</option>
        </select>
    
    <button onclick="registrarVenta()">Guardar Venta</button>
</div>

<script>
    const supabase = supabase.createClient('TU_URL', 'TU_ANON_KEY');

    // 1. Cargar las dragas al abrir la página
    async function cargarContendientes() {
        const { data, error } = await supabase
            .from('contendientes')
            .select('id, nombre')
            .eq('active', true);

        if (data) {
            const select = document.getElementById('dragaSelect');
            data.forEach(d => {
                let opt = document.createElement('option');
                opt.value = d.id;
                opt.innerHTML = d.nombre;
                select.appendChild(opt);
            });
        }
    }

    // 2. Ejecutar la venta
    async function registrarVenta() {
        const nombre = document.getElementById('nombreCliente').value;
        const email = document.getElementById('emailCliente').value;
        const dragaId = parseInt(document.getElementById('dragaSelect').value);

        if (!nombre || !email || !dragaId) return alert("Por favor llena todos los campos");

        // A. Buscar un boleto disponible que contenga esa draga
        const { data: boleto, error: errFetch } = await supabase
            .from('combinaciones_disponibles')
            .select('*')
            .eq('asignado', false)
            .contains('combination_sorted', [dragaId])
            .limit(1)
            .single();

        if (errFetch || !boleto) return alert("¡No hay boletos disponibles para esta draga!");

        // B. Asignar el boleto
        await supabase.from('combinaciones_disponibles').update({ asignado: true }).eq('id', boleto.id);

        // C. Guardar en tickets
        const { error: errInsert } = await supabase.from('tickets').insert([{
            buyer_name: nombre,
            buyer_email: email,
            favorite_drag_id: dragaId,
            combination_sorted: boleto.combination_sorted,
            is_paid: true
        }]);

        if (errInsert) return alert("Error al registrar el ticket");

        alert("¡Venta exitosa! Boleto: " + boleto.combination_sorted.join(", "));
    }

    cargarContendientes();
</script>
</body>
</html>
