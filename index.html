<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icónica - Próximamente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #2e1065 0%, #020617 100%);
            font-family: 'Inter', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .neon-text {
            color: #e5b2ca;
            text-shadow: 0 0 10px rgba(229,178,202,0.8), 0 0 20px rgba(123,44,191,0.5);
        }
        .countdown-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229,178,202,0.2);
            border-radius: 20px;
            padding: 20px;
            min-width: 80px;
        }
    </style>
</head>
<body class="p-6 text-center">

    <img src="URL_DE_TU_LOGO_AQUÍ" alt="Logo" class="h-48 md:h-64 mb-8 drop-shadow-[0_0_30px_rgba(229,178,202,0.5)]">

    <h1 class="text-4xl md:text-6xl font-black italic uppercase tracking-tighter neon-text mb-4">
        ORGULLOSAMENTE ICÓNICA
    </h1>
    
    <p class="text-xl md:text-2xl text-pink-200/60 font-light tracking-[10px] uppercase mb-12">
        Votación Próximamente
    </p>

    <div class="flex gap-4 mb-12">
        <div class="countdown-box">
            <span id="days" class="block text-4xl font-bold text-white">00</span>
            <span class="text-[10px] uppercase tracking-widest text-pink-300">Días</span>
        </div>
        <div class="countdown-box">
            <span id="hours" class="block text-4xl font-bold text-white">00</span>
            <span class="text-[10px] uppercase tracking-widest text-pink-300">Hrs</span>
        </div>
        <div class="countdown-box">
            <span id="minutes" class="block text-4xl font-bold text-white">00</span>
            <span class="text-[10px] uppercase tracking-widest text-pink-300">Min</span>
        </div>
    </div>

    <div class="mt-8">
        <p class="text-white/40 text-sm uppercase tracking-[5px]">Lanzamiento oficial</p>
        <p class="text-2xl font-bold text-pink-100">01 . JUNIO . 2024</p>
    </div>

    <script>
        // CONFIGURA LA FECHA AQUÍ (Año, Mes-1, Día, Hora, Minutos)
        const launchDate = new Date(2024, 5, 1, 0, 0, 0).getTime(); // Mes 5 es Junio

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById("days").innerText = d < 10 ? '0'+d : d;
            document.getElementById("hours").innerText = h < 10 ? '0'+h : h;
            document.getElementById("minutes").innerText = m < 10 ? '0'+m : m;

            if (distance < 0) {
                clearInterval(timer);
                document.body.innerHTML = "<h1>¡LA VOTACIÓN HA COMENZADO! Refresca la página.</h1>";
            }
        }, 1000);
    </script>
</body>
</html>
