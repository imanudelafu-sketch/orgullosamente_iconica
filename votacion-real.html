<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votación - Icónica Drag Virtual</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: radial-gradient(circle at center, #2e1065 0%, #020617 100%);
            font-family: 'Inter', sans-serif;
            color: white;
            min-height: 100vh;
        }
        .card-neon {
            border: 1px solid rgba(229,178,202,0.2);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="pt-8">

    <!-- TÍTULO RESPONSIVO CORREGIDO -->
    <h1 class="text-3xl md:text-5xl font-black italic uppercase mt-4 px-2 text-center" style="color: #e5b2ca; text-shadow: 3px 3px 0px #7b2cbf;">
        ORGULLOSAMENTE ICÓNICA
    </h1>
    <p class="text-center text-pink-200/60 tracking-[5px] text-sm md:text-base mb-12 uppercase">
        Edición Icónica
    </p>

    <!-- CONTENEDOR DE TARJETAS -->
    <!-- Se adapta de 2 columnas en celular a 4 en computadora -->
    <div id="contenedor-contendientes" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-8 max-w-6xl mx-auto px-4 pb-12">
        <!-- Las tarjetas aparecerán aquí automáticamente desde Supabase -->
    </div>

    <script>
        // 1. TUS CREDENCIALES DE SUPABASE (¡No olvides pegarlas aquí!)
        const SB_URL = 'PÉGALA_AQUÍ';
        const SB_KEY = 'PÉGALA_AQUÍ';
        
        const client = window.supabase.createClient(SB_URL, SB_KEY);

        // 2. FUNCIÓN PARA DIBUJAR A LAS CONTENDIENTES
        async function cargar() {
            const contenedor = document.getElementById('contenedor-contendientes');
            
            // OJO: Asegúrate de que tu tabla se llame 'contendientes', o cambia el nombre aquí abajo
            const { data, error } = await client.from('contendientes').select('*').order('nombre', { ascending: true });
            
            if (error) {
                console.error("Error al cargar la base de datos:", error);
                return;
            }

            contenedor.innerHTML = ''; // Limpiar antes de mostrar

            data.forEach(contendiente => {
                const card = document.createElement('div');
                card.className = "card-neon rounded-2xl p-4 flex flex-col items-center text-center";
                
                card.innerHTML = `
                    <div class="w-full h-48 md:h-64 bg-gray-800 rounded-xl mb-4 overflow-hidden border border-pink-900/30">
                        <img src="${contendiente.foto_url}" alt="${contendiente.nombre}" class="w-full h-full object-cover">
                    </div>
                    <h2 class="font-bold text-sm md:text-base uppercase mb-4 h-10 flex items-center justify-center text-pink-100">${contendiente.nombre}</h2>
                    <button onclick="votar(${contendiente.id})" class="w-full bg-[#e5b2ca] text-[#2e1065] font-black py-2 rounded-full hover:scale-105 transition-transform shadow-[0_0_15px_rgba(229,178,202,0.5)] tracking-widest text-sm md:text-base">
                        VOTAR
                    </button>
                    <p class="text-xs text-pink-200/60 mt-3 tracking-widest uppercase">Puntos: <span class="font-bold text-white">${contendiente.votos}</span></p>
                `;
                contenedor.appendChild(card);
            });
        }

        // 3. FUNCIÓN QUE REGISTRA EL VOTO
        window.votar = async function(id) {
            const hoy = new Date().toDateString();
            
            // Revisa si ya votó hoy
            if (localStorage.getItem('voto_' + hoy)) {
                return alert("¡Gracias por tu apoyo! Ya votaste hoy, vuelve mañana.");
            }

            // Ejecuta la función de incrementar en Supabase
            const { error } = await client.rpc('incrementar_voto', { row_id: id });
            
            if (error) {
                alert("Hubo un error de conexión. Intenta de nuevo.");
                console.error(error);
            } else {
                localStorage.setItem('voto_' + hoy, 'true'); // Guarda el candado en el celular
                alert("¡Tu voto ha sido registrado, mucha suerte a tu favorita!");
                cargar(); // Refresca los puntos al instante
            }
        }

        // Arrancar la página cargando los datos
        cargar();
    </script>
</body>
</html>
