<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP 5 - ORGULLOSAMENTE ICÓNICA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: radial-gradient(circle at center, #3c096c 0%, #1a0b2e 100%); color: white; min-height: 100vh; padding: 20px; font-family: sans-serif; }
        .metal-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(229, 178, 202, 0.2); backdrop-filter: blur(10px); border-radius: 1rem; padding: 20px; text-align: center; }
        .footer-banner { background: rgba(0, 0, 0, 0.3); border-top: 2px solid #d491af; padding: 2rem; margin-top: 4rem; text-align: center; }
    </style>
</head>
<body>
    <header class="text-center my-12 flex flex-col items-center">
        <h1 class="text-3xl md:text-5xl font-black italic uppercase mt-4 px-2 text-center" style="color: #e5b2ca; text-shadow: 3px 3px 0px #7b2cbf;">
            VOTACIÓN: TOP 5 ICÓNICAS
        </h1>
    </header>

    <div id="status" class="text-center text-pink-200/50 italic text-sm mb-10">Cargando ranking...</div>

    <div id="grid-votos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-w-4xl mx-auto"></div>

    <section class="footer-banner max-w-4xl mx-auto rounded-xl">
        <h2 class="text-xl md:text-2xl font-bold text-pink-200 mb-4 uppercase tracking-widest">¡No te pierdas la Gran Final!</h2>
        <p class="text-md text-gray-300 mb-6">
            Acompáñanos en <strong>Orgullosamente Icónica</strong> el próximo <strong>domingo 5 de julio a las 9 pm</strong>.
        </p>
        <a href="https://www.youtube.com/@ICONICA" target="_blank" 
           class="inline-block bg-white text-purple-900 font-black py-3 px-8 rounded-full hover:scale-105 transition-transform uppercase tracking-tighter">
            Sintoniza nuestro canal de YouTube
        </a>
    </section>

    <script>
        const SB_URL = 'https://ctptnedwysxmlpzxujel.supabase.co';
        const SB_KEY = 'sb_publishable_R6IwBFND1vd9wD-9MoID0g_AcuYWoOB';
        const client = supabase.createClient(SB_URL, SB_KEY);

        async function cargarRanking() {
            try {
                const { data, error } = await client
                    .from('contendientes')
                    .select('*')
                    .eq('active', true)
                    .order('votos_totales', { ascending: false })
                    .limit(5);
                
                if (error) throw error;

                document.getElementById('status').style.display = 'none';
                const grid = document.getElementById('grid-votos');
                
                grid.innerHTML = data.map((p, index) => `
                    <div class="metal-card">
                        <div class="text-xl font-bold text-pink-300 mb-1">#${index + 1}</div>
                        <h3 class="font-black text-xl uppercase tracking-wider text-white">${p.nombre}</h3>
                        <p class="text-[10px] mt-2 text-pink-200/60 font-bold uppercase tracking-widest">${p.votos_totales || 0} PUNTOS</p>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('status').innerText = "Error al cargar el ranking.";
            }
        }

        cargarRanking();
    </script>
</body>
</html>
