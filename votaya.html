<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORGULLOSAMENTE ICÓNICA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --rose-gold: linear-gradient(135deg, #e5b2ca 0%, #d491af 50%, #b36d8e 100%); }
        body { background: radial-gradient(circle at center, #3c096c 0%, #1a0b2e 100%); color: white; min-height: 100vh; padding: 20px; font-family: sans-serif; }
        .metal-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(229, 178, 202, 0.2); backdrop-filter: blur(10px); border-radius: 1rem; overflow: hidden; transition: 0.4s; }
        .btn-rose-gold { background: var(--rose-gold); color: #3e1026; font-weight: 900; width: 100%; padding: 12px; border-radius: 99px; text-transform: uppercase; font-size: 11px; cursor: pointer; border: none; }
    </style>
</head>
<body>
    <header class="text-center my-12 flex flex-col items-center">
        <h1 class="text-3xl md:text-5xl font-black italic uppercase mt-4 px-2 text-center" style="color: #e5b2ca; text-shadow: 3px 3px 0px #7b2cbf;">
            ORGULLOSAMENTE ICÓNICA
        </h1>
        <p class="text-pink-200/40 tracking-[6px] text-[10px] uppercase mt-2">EDICIÓN ICÓNICA</p>
    </header>

    <div id="status" class="text-center text-pink-200/50 italic text-sm mb-10">Conectando con la base de datos...</div>

    <div id="grid-votos" class="grid grid-cols-2 md:grid-cols-6 gap-6 max-w-7xl mx-auto"></div>

    <script>
        // CREDENCIALES
        const SB_URL = 'https://ctptnedwysxmlpzxujel.supabase.co';
        const SB_KEY = 'sb_publishable_R6IwBFND1vd9wD-9MoID0g_AcuYWoOB';
        const client = supabase.createClient(SB_URL, SB_KEY);

        async function cargar() {
            try {
                const { data, error } = await client.from('contendientes').select('*').eq('active', true).order('id');
                
                if (error) throw error;
                if (!data || data.length === 0) {
                    document.getElementById('status').innerText = "La tabla está vacía. Verifica tus datos en Supabase.";
                    return;
                }

                document.getElementById('status').style.display = 'none';
                const grid = document.getElementById('grid-votos');
                grid.innerHTML = data.map(p => `
                    <div class="metal-card">
                        <img src="${p.foto_url}" class="w-full h-48 object-cover">
                        <div class="p-4 text-center">
                            <h3 class="font-bold text-xs uppercase mb-3 text-white">${p.nombre}</h3>
                            <button class="btn-rose-gold" onclick="votar(${p.id})">VOTAR</button>
                            <p class="text-[9px] mt-2 text-pink-200/40 font-bold">PUNTOS: ${p.votos_totales || 0}</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('status').innerText = "Error de conexión: Verifica tus llaves y la tabla en Supabase.";
                console.error(err);
            }
        }

        async function votar(id) {
            try {
                // 1. Obtener la IP y analizar si es una VPN/Proxy usando proxycheck
                const ipResponse = await fetch('https://proxycheck.io/v2/?vpn=1');
                if (!ipResponse.ok) throw new Error("No se pudo conectar con el verificador de IP de seguridad.");
                
                const ipData = await ipResponse.json();

                // Extraer la IP del objeto de respuesta (ignorando el estado)
                const usuarioIp = Object.keys(ipData).find(key => key !== "status");
                const detallesRed = ipData[usuarioIp];

                // 2. Bloqueo si se detecta VPN activa
                if (detallesRed && detallesRed.proxy === "yes") {
                    alert("⚠️ Voto denegado: Hemos detectado el uso de una VPN o Proxy. Por favor, desactívala y usa tu red local o datos móviles para votar de forma justa.");
                    return; 
                }

                // 3. Llamar a la función inteligente de Supabase
                const { data: resultado, error } = await client.rpc('realizar_voto_ip', { 
                    row_id: id, 
                    user_ip: usuarioIp 
                });

                if (error) throw error;

                // 4. Evaluar la respuesta devuelta por la base de datos
                if (resultado === 'DUPLICADO') {
                    alert("Ya se registró una votación desde esta red el día de hoy. ¡Vuelve mañana!");
                } else if (resultado === 'OK') {
                    alert("¡Tu voto ha sido registrado con éxito!");
                    cargar(); 
                }

            } catch (err) {
                console.error("Detalle del error:", err);
                // Esta línea nos dirá el diagnóstico real si algo sale mal en el servidor o cliente
                alert("Error de validación técnico: " + err.message);
            }
        }

        cargar();
    </script>
</body>
</html>
