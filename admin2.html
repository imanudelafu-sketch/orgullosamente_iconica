<script>
    // 1. Inicializamos el cliente con un nombre distinto (supabaseClient)
    // para evitar conflictos con la librería cargada vía CDN.
    const supabaseClient = supabase.createClient('https://ctptnedwysxmlpzxujel.supabase.co', 'sb_publishable_Fwwoyf8U_irJaU3fK-S-pg_krkqXxs-');

    async function cargarContendientes() {
        try {
            // 2. Usamos supabaseClient aquí dentro
            const { data, error } = await supabaseClient
                .from('contendientes')
                .select('id, nombre')
                .eq('active', true);

            if (error) throw error;

            const select = document.getElementById('dragaSelect');
            select.innerHTML = '<option value="">Selecciona una Draga...</option>';

            data.forEach(d => {
                let opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.nombre;
                select.appendChild(opt);
            });
        } catch (err) {
            console.error("Error al cargar las dragas:", err.message);
        }
    }

    // 3. Ejecutar la carga
    cargarContendientes();
</script>
