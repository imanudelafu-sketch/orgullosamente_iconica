<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Icónica Drag Virtual</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: #1a1a1a; padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: linear-gradient(45deg, #ff00ff, #aa00aa); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: transform 0.2s; }
        button:hover { transform: scale(1.02); }
        
        #boletoSection { display: none; }
        canvas { border-radius: 12px; box-shadow: 0 0 20px rgba(255, 0, 255, 0.4); }
        
        .resumen-venta { display: none; background: #222; padding: 15px; border-radius: 10px; border-left: 5px solid #ff00ff; margin-top: 20px; }
        .resumen-venta h3 { margin-top: 0; color: #ff00ff; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registrar Venta</h2>
    <input type="text" id="nombreCliente" placeholder="Nombre del Cliente">
    <input type="email" id="emailCliente" placeholder="Correo electrónico">
    
    <label>Tipo de Venta:</label>
    <select id="tipoVenta" onchange="toggleDragaSelect()">
        <option value="produccion">Venta de Producción ($100)</option>
        <option value="participante">Apoyo a Participante</option>
    </select>

    <div id="wrapperDraga" style="display:none;">
        <label>Seleccionar Participante:</label>
        <select id="dragaSelect"></select>
    </div>

    <button onclick="registrarTicket()">Procesar Venta</button>
    <div id="resultadoVenta" class="resumen-venta"></div>
</div>

<div id="boletoSection"><canvas id="boletoCanvas" width="480" height="370"></canvas></div>

<script>
    const sb = supabase.createClient('https://ctptnedwysxmlpzxujel.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0cHRuZWR3eXN4bWxwenh1amVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3Njc5ODgsImV4cCI6MjA5MzM0Mzk4OH0.M_Jz_QfTJuKsGbNqnayvCGXkX_6tVxF42-LA8w0FH_g');

    async function cargarContendientes() {
        const { data } = await sb.from('contendientes').select('id, nombre').eq('active', true);
        const select = document.getElementById('dragaSelect');
        data.forEach(d => {
            let opt = document.createElement('option');
            opt.value = d.id; opt.textContent = d.nombre;
            select.appendChild(opt);
        });
    }

    function toggleDragaSelect() {
        const tipo = document.getElementById('tipoVenta').value;
        document.getElementById('wrapperDraga').style.display = (tipo === 'participante') ? 'block' : 'none';
    }

    async function registrarTicket() {
        const nombre = document.getElementById('nombreCliente').value;
        const email = document.getElementById('emailCliente').value;
        const tipo = document.getElementById('tipoVenta').value;
        
        // 1. Determinar ID de draga según el tipo de venta
        let dragaId;
        let dragaNombreElegida;

        if (tipo === 'produccion') {
            const { data } = await sb.from('contendientes').select('id, nombre').is('active', null).limit(1);
            if (!data || data.length === 0) return alert("No hay contendientes de producción configurados.");
            dragaId = data[0].id;
            dragaNombreElegida = "Venta Producción";
        } else {
            const select = document.getElementById('dragaSelect');
            dragaId = Number(select.value);
            dragaNombreElegida = select.options[select.selectedIndex].text;
        }

        if (!nombre || !email) return alert("Completa nombre y correo.");

        // 2. Obtener boleto y preparar datos
        const { data: boletos, error: errFetch } = await sb.rpc('marcar_y_obtener_boleto', { p_draga_id: dragaId });
        if (errFetch || !boletos) return alert("¡No hay boletos disponibles!");

        const boleto = boletos[0];
        const ticketId = crypto.randomUUID();

        // 3. Obtener nombres para la imagen
        const { data: contendientes } = await sb.from('contendientes').select('id, nombre').in('id', boleto.combination_sorted);
        let otrasReinas = contendientes.filter(c => c.id !== dragaId).map(c => c.nombre);
        otrasReinas = otrasReinas.sort(() => Math.random() - 0.5);
        const listaFinalNombres = [dragaNombreElegida, ...otrasReinas];

        dibujarBoletoImagen(listaFinalNombres, ticketId);

        // 4. Subir imagen y registrar (La inserción activa el Webhook del correo)
        const canvas = document.getElementById('boletoCanvas');
        canvas.toBlob(async (blob) => {
            await sb.storage.from('boletos').upload(`${ticketId}.png`, blob, { contentType: 'image/png' });

            await sb.from('tickets').insert([{ 
                id: ticketId, buyer_name: nombre, buyer_email: email,
                combination_id: boleto.id, favorite_drag_id: dragaId 
            }]);

            if (tipo === 'produccion') {
                await sb.from('ventas_produccion').insert([{ ticket_id: ticketId, monto: 100 }]);
            }

            document.getElementById('resultadoVenta').innerHTML = `<h3>¡Venta Registrada Exitosamente!</h3><p>ID: ${ticketId}</p>`;
            document.getElementById('resultadoVenta').style.display = 'block';
            document.getElementById('nombreCliente').value = '';
            document.getElementById('emailCliente').value = '';
        }, 'image/png');
    }

    function dibujarBoletoImagen(listaReinas, ticketId) {
        // ... (Tu función de dibujo se mantiene igual) ...
        const canvas = document.getElementById('boletoCanvas');
        const ctx = canvas.getContext('2d');
        const gradienteFondo = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 50, canvas.width/2, canvas.height/2, 300);
        gradienteFondo.addColorStop(0, '#260026'); gradienteFondo.addColorStop(1, '#070708'); 
        ctx.fillStyle = gradienteFondo;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // [resto de tu lógica de dibujo...]
    }

    cargarContendientes();
</script>
</body>
</html>
