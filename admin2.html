<script>
    // 1. Inicializamos el cliente con un nombre distinto (supabaseClient)
    // para evitar conflictos con la librería cargada vía CDN.
    const supabaseClient = supabase.createClient('https://ctptnedwysxmlpzxujel.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0cHRuZWR3eXN4bWxwenh1amVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3Njc5ODgsImV4cCI6MjA5MzM0Mzk4OH0.M_Jz_QfTJuKsGbNqnayvCGXkX_6tVxF42-LA8w0FH_g');

    async function cargarContendientes() {
        try {
            // 2. Usamos supabaseClient aquí dentro
            const { data, error } = await supabaseClient
                .from('contendientes')
                .select('id, nombre')
                .eq('active', true);

            if (error) throw error;

            const select = document.getElementById('dragaSelect');
            select.innerHTML = '<option value="">Selecciona una Draga...</option>';

            data.forEach(d => {
                let opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.nombre;
                select.appendChild(opt);
            });
        } catch (err) {
            console.error("Error al cargar las dragas:", err.message);
        }
    }

    // 3. Ejecutar la carga
    cargarContendientes();
</script>
