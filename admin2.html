<select id="dragaSelect">
    <option value="">Cargando dragas...</option>
</select>

<script>
    // 1. Configura tu cliente (asegúrate de tener tu URL y KEY reales aquí)
    // TUS CREDENCIALES
        const SB_URL = 'https://ctptnedwysxmlpzxujel.supabase.co';
        const SB_KEY = 'sb_publishable_R6IwBFND1vd9wD-9MoID0g_AcuYWoOB';
    const supabase = supabase.createClient(SB_URL, SB_KEY);

    async function cargarContendientes() {
        try {
            const { data, error } = await supabase
                .from('contendientes')
                .select('id, nombre')
                .eq('active', true);

            if (error) throw error;

            const select = document.getElementById('dragaSelect');
            select.innerHTML = '<option value="">Selecciona una Draga...</option>';

            data.forEach(d => {
                let opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.nombre;
                select.appendChild(opt);
            });
            console.log("Drogas cargadas correctamente:", data);
        } catch (err) {
            console.error("Error al cargar las dragas:", err.message);
        }
    }

    // 2. Ejecutar la carga
    cargarContendientes();
</script>
