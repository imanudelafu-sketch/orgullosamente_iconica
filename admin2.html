<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selector de ID - Icónica</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #fff; padding: 40px; display: flex; justify-content: center; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; }
        select { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: white; }
        #resultado { font-size: 1.5em; color: #ff00ff; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Selector de Draga</h2>
    
    <select id="dragaSelect" onchange="mostrarId()">
        <option value="">Selecciona una Draga...</option>
    </select>
    
    <p>El ID seleccionado es:</p>
    <div id="resultado">-</div>
</div>

<script>
    const sb = supabase.createClient('https://ctptnedwysxmlpzxujel.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0cHRuZWR3eXN4bWxwenh1amVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3Njc5ODgsImV4cCI6MjA5MzM0Mzk4OH0.M_Jz_QfTJuKsGbNqnayvCGXkX_6tVxF42-LA8w0FH_g');

    async function cargarContendientes() {
        const { data } = await sb.from('contendientes').select('id, nombre').eq('active', true);
        const select = document.getElementById('dragaSelect');
        
        if (data) {
            data.forEach(d => {
                let opt = document.createElement('option');
                opt.value = d.id; // Aquí el valor es el ID
                opt.textContent = d.nombre; // Aquí el texto es el nombre
                select.appendChild(opt);
            });
        }
    }

    function mostrarId() {
        const select = document.getElementById('dragaSelect');
        const resDiv = document.getElementById('resultado');
        resDiv.innerText = select.value ? select.value : "-";
    }

    cargarContendientes();
</script>
</body>
</html>
