<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Icónica Drag Virtual</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: #1a1a1a; padding: 20px; border-radius: 15px; width: 100%; max-width: 450px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #ff00ff; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        #boletoSection { margin-top: 30px; display: none; text-align: center; }
        canvas { border: 2px solid #ff00ff; border-radius: 10px; background: #000; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registrar Venta</h2>
    <input type="text" id="nombreCliente" placeholder="Nombre del Cliente">
    <input type="email" id="emailCliente" placeholder="Correo electrónico">
    <select id="dragaSelect"></select>
    <button onclick="registrarTicket()">Guardar Ticket y Generar Boleto</button>
</div>

<div id="boletoSection">
    <canvas id="boletoCanvas" width="500" height="250"></canvas>
    <button onclick="descargarBoleto()" style="background: #33cc33;">Descargar Boleto PNG</button>
</div>

<script>
    const sb = supabase.createClient('https://ctptnedwysxmlpzxujel.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0cHRuZWR3eXN4bWxwenh1amVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3Njc5ODgsImV4cCI6MjA5MzM0Mzk4OH0.M_Jz_QfTJuKsGbNqnayvCGXkX_6tVxF42-LA8w0FH_g');

    async function cargarContendientes() {
        const { data } = await sb.from('contendientes').select('id, nombre').eq('active', true);
        const select = document.getElementById('dragaSelect');
        data.forEach(d => {
            let opt = document.createElement('option');
            opt.value = d.id; opt.textContent = d.nombre;
            select.appendChild(opt);
        });
    }

    async function registrarTicket() {
    const nombre = document.getElementById('nombreCliente').value;
    const email = document.getElementById('emailCliente').value;
    const dragaId = Number(document.getElementById('dragaSelect').value);

    if (!nombre || !email || !dragaId) return alert("Completa todos los campos.");

    // 1. Llamar función RPC para obtener el boleto
    const { data: boletos, error: errFetch } = await sb.rpc('buscar_boleto_disponible', { p_draga_id: dragaId });
    if (errFetch || !boletos || boletos.length === 0) return alert("No hay boletos disponibles.");
    
    const boleto = boletos[0];

    // 2. Registrar en tickets
    const { data: ticket, error: errInsert } = await sb.from('tickets').insert([{ 
        buyer_name: nombre, 
        buyer_email: email,
        combination_id: boleto.id 
    }]).select('id').single();
    
    if (errInsert) return alert("Error al registrar: " + errInsert.message);

    // 3. Obtener nombres de las dragas para el dibujo
    const { data: contendientes } = await sb.from('contendientes').select('nombre').in('id', boleto.combination_sorted);
    const nombres = contendientes.map(c => c.nombre);

    // 4. AQUÍ ESTÁ EL CAMBIO: Llamamos a dibujarBoleto
    dibujarBoleto(nombres, ticket.id);
    
    // 5. Marcar como asignado
    await sb.from('combinaciones_disponibles').update({ asignado: true }).eq('id', boleto.id);
    alert("¡Venta exitosa! ID Ticket: " + ticket.id);
}

    cargarContendientes();
</script>
</body>
</html>
