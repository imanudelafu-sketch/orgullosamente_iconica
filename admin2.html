<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Icónica Drag Virtual</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #fff; padding: 40px; display: flex; justify-content: center; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: white; }
        button { width: 100%; padding: 15px; background: #ff00ff; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registrar Venta</h2>
    <input type="text" id="nombreCliente" placeholder="Nombre del Cliente">
    <input type="email" id="emailCliente" placeholder="Correo electrónico">
    
    <select id="dragaSelect">
        <option value="">Cargando dragas...</option>
    </select>
    
    <button onclick="procesarVenta()">Guardar Venta</button>
</div>

<script>
    // Inicialización del cliente
    const sb = supabase.createClient('https://ctptnedwysxmlpzxujel.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0cHRuZWR3eXN4bWxwenh1amVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3Njc5ODgsImV4cCI6MjA5MzM0Mzk4OH0.M_Jz_QfTJuKsGbNqnayvCGXkX_6tVxF42-LA8w0FH_g');

    async function cargarContendientes() {
        const { data } = await sb.from('contendientes').select('id, nombre').eq('active', true);
        const select = document.getElementById('dragaSelect');
        select.innerHTML = '<option value="">Selecciona una Draga...</option>';
        if (data) {
            data.forEach(d => {
                let opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.nombre;
                select.appendChild(opt);
            });
        }
    }

    async function procesarVenta() {
        const nombre = document.getElementById('nombreCliente').value;
        const email = document.getElementById('emailCliente').value;
        // Convertimos a número obligatoriamente
        const dragaId = Number(document.getElementById('dragaSelect').value);

        if (!nombre || !email || !dragaId) return alert("Completa todos los campos");

        console.log("Intentando buscar boletos que contengan la draga ID:", dragaId);

        // A. Búsqueda refinada
        const { data: boleto, error: errFetch } = await sb
            .from('combinaciones_disponibles')
            .select('*')
            .eq('asignado', false)
            .contains('combination_sorted', [dragaId]) // Filtro para array
            .limit(1)
            .single();

        if (errFetch || !boleto) {
            console.error("Error en búsqueda:", errFetch);
            return alert("No se encontró ningún boleto disponible para la draga seleccionada.");
        }

        // B. Actualizar asignación
        await sb.from('combinaciones_disponibles').update({ asignado: true }).eq('id', boleto.id);

        // C. Insertar Ticket
        const { error: errInsert } = await sb.from('tickets').insert([{
            buyer_name: nombre,
            buyer_email: email,
            favorite_drag_id: dragaId,
            combination_id: boleto.id,
            combination: boleto.combination_sorted,
            combination_sorted: boleto.combination_sorted,
            is_paid: true
        }]);

        if (errInsert) return alert("Error al registrar: " + errInsert.message);

        alert("¡Venta exitosa! Folio: " + boleto.id + "\nCombinación: " + boleto.combination_sorted.join(", "));
    }

    cargarContendientes();
</script>
</body>
</html>
