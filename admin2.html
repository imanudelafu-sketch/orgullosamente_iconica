<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Combinaciones por ID</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; padding: 40px; display: flex; justify-content: center; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 15px; width: 100%; max-width: 500px; }
        select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; }
        button { width: 100%; padding: 15px; background: #33cc33; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .resultado-item { padding: 15px; border-bottom: 1px solid #333; background: #222; margin-top: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Buscar Combinaciones</h2>
    <select id="dragaSelect">
        <option value="">Cargando dragas...</option>
    </select>
    
    <button onclick="buscarPorId()">Buscar Combinaciones Disponibles</button>
    <div id="resultado"></div>
</div>

<script>
    const sb = supabase.createClient('https://ctptnedwysxmlpzxujel.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0cHRuZWR3eXN4bWxwenh1amVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3Njc5ODgsImV4cCI6MjA5MzM0Mzk4OH0.M_Jz_QfTJuKsGbNqnayvCGXkX_6tVxF42-LA8w0FH_g');

    async function cargarContendientes() {
        const { data } = await sb.from('contendientes').select('id, nombre').eq('active', true);
        const select = document.getElementById('dragaSelect');
        select.innerHTML = '<option value="">Elige una Draga...</option>';
        if (data) {
            data.forEach(d => {
                let opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.nombre;
                select.appendChild(opt);
            });
        }
    }
console.log("Buscando en BD. ID enviado:", dragaId, "Tipo de dato:", typeof dragaId);
    async function buscarPorId() {
        const dragaId = Number(document.getElementById('dragaSelect').value);
        const resDiv = document.getElementById('resultado');
        
        if (!dragaId) return alert("Selecciona una draga");
        resDiv.innerHTML = "Buscando...";

        // Consultamos la tabla combinaciones_disponibles directamente
        // Buscamos donde el array contenga el ID y no esté asignado
        const { data, error } = await sb
            .from('combinaciones_disponibles')
            .select('id, combination_sorted')
            .eq('asignado', false)
            .contains('combination_sorted', [dragaId]);

        if (error) {
            resDiv.innerHTML = "Error: " + error.message;
            return;
        }

        resDiv.innerHTML = `<h3>Resultados para Draga ID: ${dragaId}</h3>`;
        if (data && data.length > 0) {
            data.forEach(item => {
                resDiv.innerHTML += `
                    <div class="resultado-item">
                        <strong>ID Combinación:</strong> ${item.id} <br>
                        <strong>Combinación:</strong> ${item.combination_sorted.join(", ")}
                    </div>`;
            });
        } else {
            resDiv.innerHTML += "<p>No hay combinaciones disponibles para este ID.</p>";
        }
    }

    cargarContendientes();
</script>
</body>
</html>
