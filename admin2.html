<script>
    const sb = supabase.createClient('TU_URL', 'TU_ANON_KEY');

    async function auditarBaseDeDatos() {
        console.log("Iniciando auditoría...");
        
        // 1. Traer TODOS los boletos, sin filtros
        const { data, error } = await sb
            .from('combinaciones_disponibles')
            .select('id, combination_sorted, asignado')
            .limit(10); // Solo los primeros 10 para no saturar

        if (error) {
            console.error("Error al leer la base de datos:", error);
            return;
        }

        console.table(data);
        alert("Revisa la consola (F12) para ver la tabla de datos.");
    }

    auditarBaseDeDatos();
</script>
